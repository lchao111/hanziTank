name: Deploy Hanzi Tank to GitHub Pages

on:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Codex/2026-05-20/TankGame
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Codex/2026-05-20/TankGame/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production site
        run: npm run build
        env:
          HANZI_TANK_LEADERBOARD_API: https://hanzitankapie34413bf.azurewebsites.net/api

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Codex/2026-05-20/TankGame/.deploy/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


